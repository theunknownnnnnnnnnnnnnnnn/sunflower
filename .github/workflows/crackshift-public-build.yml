name: CRACKSHIFT APK Builder

on:
  push:
    branches: [crackshift-apk-build-20260830]
    paths:
      - 'crackshift_build/**'
      - '.github/workflows/crackshift-public-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify CRACKSHIFT source
        shell: bash
        run: |
          set -euo pipefail
          echo '2ff6cd80bbf48e9828d64154ae628de47842a8f2bfaa32b659e510904dfb96e5  crackshift_build/split/p00' | sha256sum -c -
          echo '3dd8f8b95593ea1c764b88b2fcef430e18fc51894797aae35c820f9c4f577b83  crackshift_build/split/p01' | sha256sum -c -
          echo '5fa570c00f752b34110c612d57e77aea17248b8ad7b81e953217b4217a9a5e5b  crackshift_build/split/p02' | sha256sum -c -
          echo '41d539d5841c4fc1789e82e3023be35d3c13af3931bd30b613bf7437e3c5e708  crackshift_build/split/p03' | sha256sum -c -
          cat crackshift_build/split/p00 crackshift_build/split/p01 crackshift_build/split/p02 crackshift_build/split/p03 > /tmp/crackshift-min.tar.gz
          echo '28deb30b9e88a59fcaa1208c33074becf9c7ab61d3458b61c6dbfd1ca4371eaf  /tmp/crackshift-min.tar.gz' | sha256sum -c -
          gzip -t /tmp/crackshift-min.tar.gz
          mkdir -p .crackshift_tmp/src
          tar -xzf /tmp/crackshift-min.tar.gz -C .crackshift_tmp/src
          grep -q "versionName '1.1.0'" .crackshift_tmp/src/app/build.gradle
          grep -q 'MASTER CRACK' .crackshift_tmp/src/app/src/main/java/com/metanoia/crackshift/CrackShiftView.java
          grep -q 'LevelInsight' .crackshift_tmp/src/app/src/main/java/com/metanoia/crackshift/CrackEngine.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unit tests and APK build
        working-directory: .crackshift_tmp/src
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='.crackshift_tmp/src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/CRACKSHIFT-playable-v1.1.apk
          sha256sum dist/CRACKSHIFT-playable-v1.1.apk | tee dist/SHA256.txt
          unzip -t dist/CRACKSHIFT-playable-v1.1.apk >/dev/null
          ls -lh dist/CRACKSHIFT-playable-v1.1.apk

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: CRACKSHIFT-playable-v1.1
          path: |
            dist/CRACKSHIFT-playable-v1.1.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
